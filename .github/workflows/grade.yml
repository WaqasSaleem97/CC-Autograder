name: Grade approved students

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: "Firestore course ID or course code, for example cc"
        required: true
        default: "CC"
        type: string
      category:
        description: "Marks category, for example Labs or Assignments"
        required: true
        default: "Lab"
        type: string
      assessment_name:
        description: "Assessment name, for example Lab 1"
        required: true
        default: "Lab 1"
        type: string
      repository_name:
        description: "Student repository name"
        required: true
        default: "CC"
        type: string
      submission_path:
        description: "Select the directory containing the student submission"
        required: true
        default: "Labs/Lab01"
        type: choice
        options:
          - "Labs/Lab01"
          - "Labs/Lab02"
          - "Labs/Lab03"
          - "Labs/Lab04"
          - "Labs/Lab05"
          - "Labs/Lab06"
          - "Labs/Lab07"
          - "Labs/Lab08"
          - "Labs/Lab09"
          - "Labs/Lab10"
          - "Labs/Lab11"
          - "Labs/Lab12"
          - "Labs/Lab13"
          - "Labs/Lab14"
          - "Labs/Lab15"
          - "Labs/Lab16"
          - "Labs/Mid"
          - "Labs/Final"
          - "Assignments/Assignment01"
          - "Assignments/Assignment02"
          - "Assignments/Assignment03"
          - "Assignments/Assignment04"
          - "Assignments/Assignment05"
          - "Quiz/Quiz01"
          - "Quiz/Quiz02"
          - "Quiz/Quiz03"
          - "Quiz/Quiz04"
          - "Quiz/Quiz05"
          - "Project"
          - "MidExam"
          - "FinalExam"
      total_marks:
        description: "Maximum marks"
        required: true
        default: "10"
        type: string
      branch:
        description: "Student repository branch"
        required: true
        default: "main"
        type: string
      section:
        description: "Section to grade"
        required: true
        default: "Both"
        type: choice
        options:
          - "Both"
          - "A"
          - "B"
      student_selection:
        description: "Students to grade"
        required: true
        default: "All"
        type: choice
        options:
          - "All"
          - "Registration numbers"
      registration_numbers:
        description: "Comma-separated numbers; required for Registration numbers"
        required: false
        type: string
      update_firestore:
        description: "Save generated marks to Firestore"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select-students:
    name: Select approved students
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Load approved students
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          COURSE_ID: ${{ inputs.course_id }}
          SECTION: ${{ inputs.section }}
          STUDENT_SELECTION: ${{ inputs.student_selection }}
          REGISTRATION_NUMBERS: ${{ inputs.registration_numbers }}
        run: node scripts/load-students.js
      - name: Upload selected student list
        uses: actions/upload-artifact@v4
        with:
          name: selected-students
          path: results/students.json
          if-no-files-found: error
          retention-days: 1

  grade:
    name: Grade selected students without Firebase credentials
    needs: select-students
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OCR_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install OCR and image-comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            python3-pil
      - name: Select trusted test script automatically
        env:
          SUBMISSION_PATH: ${{ inputs.submission_path }}
        run: |
          case "$SUBMISSION_PATH" in
            "Labs/Lab01") TEST_SCRIPT="tests/Lab1/test.sh" ;;
            "Labs/Lab02") TEST_SCRIPT="tests/Lab2/test.sh" ;;
            "Labs/Lab03") TEST_SCRIPT="tests/Lab3/test.sh" ;;
            "Labs/Lab04") TEST_SCRIPT="tests/Lab4/test.sh" ;;
            "Labs/Lab05") TEST_SCRIPT="tests/Lab5/test.sh" ;;
            "Labs/Lab06") TEST_SCRIPT="tests/Lab6/test.sh" ;;
            "Labs/Lab07") TEST_SCRIPT="tests/Lab7/test.sh" ;;
            "Labs/Lab08") TEST_SCRIPT="tests/Lab8/test.sh" ;;
            "Labs/Lab09") TEST_SCRIPT="tests/Lab9/test.sh" ;;
            "Labs/Lab10") TEST_SCRIPT="tests/Lab10/test.sh" ;;
            "Labs/Lab11") TEST_SCRIPT="tests/Lab11/test.sh" ;;
            "Labs/Lab12") TEST_SCRIPT="tests/Lab12/test.sh" ;;
            "Labs/Lab13") TEST_SCRIPT="tests/Lab13/test.sh" ;;
            "Labs/Lab14") TEST_SCRIPT="tests/Lab14/test.sh" ;;
            "Labs/Lab15") TEST_SCRIPT="tests/Lab15/test.sh" ;;
            "Labs/Lab16") TEST_SCRIPT="tests/Lab16/test.sh" ;;
            "Labs/Mid") TEST_SCRIPT="tests/LabMid/test.sh" ;;
            "Labs/Final") TEST_SCRIPT="tests/LabFinal/test.sh" ;;
            "Assignments/Assignment01") TEST_SCRIPT="tests/Assignment01/test.sh" ;;
            "Assignments/Assignment02") TEST_SCRIPT="tests/Assignment02/test.sh" ;;
            "Assignments/Assignment03") TEST_SCRIPT="tests/Assignment03/test.sh" ;;
            "Assignments/Assignment04") TEST_SCRIPT="tests/Assignment04/test.sh" ;;
            "Assignments/Assignment05") TEST_SCRIPT="tests/Assignment05/test.sh" ;;
            "Quiz/Quiz01") TEST_SCRIPT="tests/Quiz01/test.sh" ;;
            "Quiz/Quiz02") TEST_SCRIPT="tests/Quiz02/test.sh" ;;
            "Quiz/Quiz03") TEST_SCRIPT="tests/Quiz03/test.sh" ;;
            "Quiz/Quiz04") TEST_SCRIPT="tests/Quiz04/test.sh" ;;
            "Quiz/Quiz05") TEST_SCRIPT="tests/Quiz05/test.sh" ;;
            "Project") TEST_SCRIPT="tests/Project/test.sh" ;;
            "MidExam") TEST_SCRIPT="tests/MidExam/test.sh" ;;
            "FinalExam") TEST_SCRIPT="tests/FinalExam/test.sh" ;;
            *)
              echo "::error::Unsupported submission path: $SUBMISSION_PATH"
              exit 1
              ;;
          esac

          if [[ ! -f "$TEST_SCRIPT" ]]; then
            echo "::error::The selected test script does not exist: $TEST_SCRIPT"
            exit 1
          fi

          echo "Selected submission path: $SUBMISSION_PATH"
          echo "Selected trusted test script: $TEST_SCRIPT"
          echo "TEST_SCRIPT=$TEST_SCRIPT" >> "$GITHUB_ENV"
      - name: Create and validate grading configuration
        env:
          COURSE_ID: ${{ inputs.course_id }}
          CATEGORY: ${{ inputs.category }}
          ASSESSMENT_NAME: ${{ inputs.assessment_name }}
          REPOSITORY_NAME: ${{ inputs.repository_name }}
          SUBMISSION_PATH: ${{ inputs.submission_path }}
          TOTAL_MARKS: ${{ inputs.total_marks }}
          BRANCH: ${{ inputs.branch }}
        run: node scripts/create-config.js
      - name: Download selected students
        uses: actions/download-artifact@v4
        with:
          name: selected-students
          path: results
      - name: Collect submissions
        env:
          GH_TOKEN: ${{ secrets.STUDENT_REPOS_TOKEN }}
        run: node scripts/collect-submissions.js --students-file results/students.json
      - name: Grade submissions
        run: node scripts/grade-submissions.js --students-file results/students.json
      - name: Show results
        run: node scripts/show-results.js
      - name: Upload grading results
        uses: actions/upload-artifact@v4
        with:
          name: grading-results
          path: results/grading-results.json
          if-no-files-found: error
          retention-days: 7

  update-firestore:
    name: Update Firestore in trusted job
    needs: grade
    if: ${{ inputs.update_firestore }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select trusted test script automatically
        env:
          SUBMISSION_PATH: ${{ inputs.submission_path }}
        run: |
          case "$SUBMISSION_PATH" in
            "Labs/Lab01") TEST_SCRIPT="tests/Lab1/test.sh" ;;
            "Labs/Lab02") TEST_SCRIPT="tests/Lab2/test.sh" ;;
            "Labs/Lab03") TEST_SCRIPT="tests/Lab3/test.sh" ;;
            "Labs/Lab04") TEST_SCRIPT="tests/Lab4/test.sh" ;;
            "Labs/Lab05") TEST_SCRIPT="tests/Lab5/test.sh" ;;
            "Labs/Lab06") TEST_SCRIPT="tests/Lab6/test.sh" ;;
            "Labs/Lab07") TEST_SCRIPT="tests/Lab7/test.sh" ;;
            "Labs/Lab08") TEST_SCRIPT="tests/Lab8/test.sh" ;;
            "Labs/Lab09") TEST_SCRIPT="tests/Lab9/test.sh" ;;
            "Labs/Lab10") TEST_SCRIPT="tests/Lab10/test.sh" ;;
            "Labs/Lab11") TEST_SCRIPT="tests/Lab11/test.sh" ;;
            "Labs/Lab12") TEST_SCRIPT="tests/Lab12/test.sh" ;;
            "Labs/Lab13") TEST_SCRIPT="tests/Lab13/test.sh" ;;
            "Labs/Lab14") TEST_SCRIPT="tests/Lab14/test.sh" ;;
            "Labs/Lab15") TEST_SCRIPT="tests/Lab15/test.sh" ;;
            "Labs/Lab16") TEST_SCRIPT="tests/Lab16/test.sh" ;;
            "Labs/Mid") TEST_SCRIPT="tests/LabMid/test.sh" ;;
            "Labs/Final") TEST_SCRIPT="tests/LabFinal/test.sh" ;;
            "Assignments/Assignment01") TEST_SCRIPT="tests/Assignment01/test.sh" ;;
            "Assignments/Assignment02") TEST_SCRIPT="tests/Assignment02/test.sh" ;;
            "Assignments/Assignment03") TEST_SCRIPT="tests/Assignment03/test.sh" ;;
            "Assignments/Assignment04") TEST_SCRIPT="tests/Assignment04/test.sh" ;;
            "Assignments/Assignment05") TEST_SCRIPT="tests/Assignment05/test.sh" ;;
            "Quiz/Quiz01") TEST_SCRIPT="tests/Quiz01/test.sh" ;;
            "Quiz/Quiz02") TEST_SCRIPT="tests/Quiz02/test.sh" ;;
            "Quiz/Quiz03") TEST_SCRIPT="tests/Quiz03/test.sh" ;;
            "Quiz/Quiz04") TEST_SCRIPT="tests/Quiz04/test.sh" ;;
            "Quiz/Quiz05") TEST_SCRIPT="tests/Quiz05/test.sh" ;;
            "Project") TEST_SCRIPT="tests/Project/test.sh" ;;
            "MidExam") TEST_SCRIPT="tests/MidExam/test.sh" ;;
            "FinalExam") TEST_SCRIPT="tests/FinalExam/test.sh" ;;
            *)
              echo "::error::Unsupported submission path: $SUBMISSION_PATH"
              exit 1
              ;;
          esac

          if [[ ! -f "$TEST_SCRIPT" ]]; then
            echo "::error::The selected test script does not exist: $TEST_SCRIPT"
            exit 1
          fi

          echo "Selected submission path: $SUBMISSION_PATH"
          echo "Selected trusted test script: $TEST_SCRIPT"
          echo "TEST_SCRIPT=$TEST_SCRIPT" >> "$GITHUB_ENV"
      - name: Create trusted grading configuration
        env:
          COURSE_ID: ${{ inputs.course_id }}
          CATEGORY: ${{ inputs.category }}
          ASSESSMENT_NAME: ${{ inputs.assessment_name }}
          REPOSITORY_NAME: ${{ inputs.repository_name }}
          SUBMISSION_PATH: ${{ inputs.submission_path }}
          TOTAL_MARKS: ${{ inputs.total_marks }}
          BRANCH: ${{ inputs.branch }}
        run: node scripts/create-config.js
      - name: Download grading results
        uses: actions/download-artifact@v4
        with:
          name: grading-results
          path: results
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Reload trusted student list
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          COURSE_ID: ${{ inputs.course_id }}
          SECTION: ${{ inputs.section }}
          STUDENT_SELECTION: ${{ inputs.student_selection }}
          REGISTRATION_NUMBERS: ${{ inputs.registration_numbers }}
        run: node scripts/load-students.js
      - name: Validate and update Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node scripts/update-firestore.js