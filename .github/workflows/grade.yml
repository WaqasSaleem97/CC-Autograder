name: Grade all approved students

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: "Firestore course ID, for example CC"
        required: true
        type: string

      section:
        description: "Select the students' section"
        required: true
        default: "Both"
        type: choice
        options:
          - "Both"
          - "A"
          - "B"

      assessment:
        description: "Assessment configuration name, for example Lab1"
        required: true
        default: "Lab1"
        type: string

      update_firestore:
        description: "Save generated marks to Firestore"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  grade:
    name: Grade approved students
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trusted autograder
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create results directory
        run: mkdir -p results

      # This service account is used to read approved students from Firestore.
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Load approved students from Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          COURSE_ID: ${{ inputs.course_id }}
          SECTION: ${{ inputs.section }}
        run: node scripts/load-students.js

      - name: Show selected student count
        run: |
          node -e "
          const fs = require('fs');
          const students = JSON.parse(
            fs.readFileSync('results/students.json', 'utf8')
          );

          console.log('Students selected:', students.length);

          if (students.length === 0) {
            throw new Error(
              'No approved students were found for the selected course and section.'
            );
          }
          "

      # STUDENT_REPOS_TOKEN is required when student repositories are private.
      - name: Collect student submissions
        env:
          GH_TOKEN: ${{ secrets.STUDENT_REPOS_TOKEN }}
        run: |
          node scripts/collect-submissions.js \
            --students-file results/students.json \
            --assessment "${{ inputs.assessment }}"

      - name: Grade student submissions
        run: |
          node scripts/grade-submissions.js \
            --students-file results/students.json \
            --assessment "${{ inputs.assessment }}"

      - name: Display grading summary
        run: |
          node -e "
          const fs = require('fs');
          const results = JSON.parse(
            fs.readFileSync('results/grading-results.json', 'utf8')
          );

          console.log('Grading completed for', results.length, 'students');

          for (const result of results) {
            console.log(
              result.github_username +
              ': ' +
              result.obtained +
              '/' +
              result.total +
              ' - ' +
              (result.feedback || '')
            );
          }
          "

      - name: Upload grading results
        uses: actions/upload-artifact@v4
        with:
          name: grading-results-${{ inputs.course_id }}-${{ inputs.section }}-${{ inputs.assessment }}
          path: |
            results/students.json
            results/grading-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Update Firestore
        if: ${{ inputs.update_firestore }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          COURSE_ID: ${{ inputs.course_id }}
          SECTION: ${{ inputs.section }}
          ASSESSMENT: ${{ inputs.assessment }}
        run: node scripts/update-firestore.js